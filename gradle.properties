# Keep Gradle and Kotlin in separate, bounded JVMs on the 8 GiB development Mac.
# One worker prevents simultaneous Android/Kotlin compilers from multiplying memory use.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=3
kotlin.daemon.useFallbackStrategy=false
kotlin.build.report.output=file
android.useAndroidX=true
kotlin.code.style=official
